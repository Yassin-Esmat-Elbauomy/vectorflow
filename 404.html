<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Redirecting...</title>
  <script>
    sessionStorage.setItem('vf_redirect', window.location.pathname + window.location.search);
    var parts = window.location.pathname.split('/').filter(Boolean);
    var base = '/';
    if (window.location.hostname.endsWith('github.io') && parts.length > 0) {
      base = '/' + parts[0] + '/';
    }
    window.location.replace(base);
  </script>
</head>
<body>
</body>
</html>
